<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Sliding Puzzle 3×3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at 30% 20%, #1a1a2e, #0f0f1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            padding: 16px;
            margin: 0;
        }

        .game-wrapper {
            background: rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(8px);
            padding: 30px 25px 35px;
            border-radius: 70px 70px 50px 50px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 0 3px #feda5e inset, 0 0 0 6px #4a3a2e inset;
        }

        .game-container {
            background: #2a1f35;
            padding: 22px 20px 20px;
            border-radius: 60px 60px 36px 36px;
            box-shadow: 0 12px 0 #150e1a, 0 20px 40px #000000bb;
        }

        h1 {
            text-align: center;
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #f7e05e;
            text-shadow: 0 5px 0 #8f6f2a, 0 10px 20px #00000099;
            margin-top: -12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        h1 span {
            background: #ffb347;
            padding: 0 18px;
            border-radius: 100px;
            font-size: 1.6rem;
            color: #1f1428;
            text-shadow: none;
            box-shadow: 0 5px 0 #7a4f1a;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #3d2b4d;
            padding: 16px;
            border-radius: 40px;
            box-shadow: 0 8px 0 #1f1428, 0 16px 32px #000000cc;
            margin-bottom: 14px;
            position: relative;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .cell {
            width: 110px;
            height: 110px;
            background: #4a3460;
            border-radius: 24px 8px 24px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.8rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 3px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #1f1428, 0 6px 16px #00000077;
            position: relative;
            transform: scale(1);
        }

        .cell:not(.empty):hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .cell:active {
            transform: scale(0.92);
        }

        .cell.empty {
            background: #1f1428;
            box-shadow: inset 0 0 20px #00000099, 0 6px 0 #0d0912;
            cursor: default;
            opacity: 0.3;
        }

        /* Colors for tiles */
        .tile-1 { background: linear-gradient(145deg, #ff6b7f, #d92e4a); }
        .tile-2 { background: linear-gradient(145deg, #6ee0d6, #28a89c); }
        .tile-3 { background: linear-gradient(145deg, #ffe680, #e6b82a); }
        .tile-4 { background: linear-gradient(145deg, #d4a0f7, #a85de0); }
        .tile-5 { background: linear-gradient(145deg, #ffb34a, #e07d1a); }
        .tile-6 { background: linear-gradient(145deg, #7fb0ff, #3a6fd4); }
        .tile-7 { background: linear-gradient(145deg, #ff8a9c, #d94a62); }
        .tile-8 { background: linear-gradient(145deg, #a8e06a, #6db83a); }
        .tile-9 { 
            background: linear-gradient(145deg, #ffd700, #f0a500);
            color: #1f1428;
            text-shadow: 0 3px 12px #ffdd44;
            box-shadow: 0 0 30px #ffd70088, 0 6px 0 #8f6f1a;
            animation: goldenGlow 1s infinite alternate;
        }

        @keyframes goldenGlow {
            0% { box-shadow: 0 0 20px #ffd70066, 0 6px 0 #8f6f1a; }
            100% { box-shadow: 0 0 50px #ffd700cc, 0 0 80px #ffaa00aa, 0 6px 0 #8f6f1a; }
        }

        .tile-1, .tile-2, .tile-3, .tile-4, .tile-5, .tile-6, .tile-7, .tile-8 {
            box-shadow: 0 0 0 2px #ffffff66, 0 6px 0 #1f1428, 0 6px 12px #00000077;
        }

        /* Slide animation */
        .cell.sliding {
            animation: slideIn 0.2s ease-out forwards;
        }

        @keyframes slideIn {
            0% { transform: scale(0.7) rotate(-5deg); opacity: 0.5; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Number 9 appearing animation */
        .cell.appear-nine {
            animation: nineAppear 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.4) forwards;
        }

        @keyframes nineAppear {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.8) rotate(20deg); opacity: 1; filter: brightness(2); }
            70% { transform: scale(0.9) rotate(-10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Confetti effect */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.3); opacity: 0; }
        }

        .score-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #1f1428;
            border-radius: 80px;
            margin-top: 12px;
            box-shadow: 0 5px 0 #0d0912, inset 0 2px 12px #f7e05e33;
            color: #fae374;
        }

        .moves-box {
            background: #150e1a;
            padding: 6px 28px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 700;
            box-shadow: inset 0 3px 10px #000000bb, 0 4px 0 #4a3a2e;
            color: #f7d44a;
            text-shadow: 0 2px 0 #6b4f1a;
        }

        .reset-btn {
            background: #f7d44a;
            border: none;
            color: #1f1428;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 6px 28px;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a5f2a, 0 6px 16px #000000aa;
            transition: 0.06s linear;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .reset-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #7a5f2a;
        }
        .reset-btn:hover {
            background: #ffe680;
            filter: brightness(1.1);
        }

        .message {
            text-align: center;
            margin-top: 14px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #f7e05e;
            text-shadow: 0 2px 8px #000000dd;
            min-height: 2.5rem;
        }

        @media (max-width: 550px) {
            .cell { width: 80px; height: 80px; font-size: 2.8rem; }
            .board { gap: 6px; padding: 12px; }
            h1 { font-size: 1.8rem; }
            .moves-box { font-size: 1.4rem; padding: 4px 18px; }
            .reset-btn { font-size: 1.2rem; padding: 4px 18px; }
        }

        @media (max-width: 400px) {
            .cell { width: 60px; height: 60px; font-size: 2rem; border-radius: 16px 4px 16px 4px; }
            .board { gap: 5px; padding: 10px; }
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="game-container">
        <h1>
            🧩 Sliding Puzzle
            <span>3×3</span>
        </h1>

        <div id="board" class="board"></div>

        <div class="score-panel">
            <div class="moves-box">👆 <span id="movesDisplay">0</span></div>
            <button class="reset-btn" id="resetBtn">🔀 Shuffle</button>
        </div>
        <div id="message" class="message">🎯 Arrange numbers 1-8 in order!</div>
    </div>
</div>

<script>
    (function() {
        const SIZE = 3;
        const TOTAL_CELLS = SIZE * SIZE;
        let board = [];
        let emptyRow = 2, emptyCol = 2;
        let moves = 0;
        let isGameOver = false;
        let isAnimating = false;
        let isWinAnimationDone = false;

        const boardElement = document.getElementById('board');
        const movesSpan = document.getElementById('movesDisplay');
        const messageEl = document.getElementById('message');

        // Create solved board
        function createSolvedBoard() {
            const b = [];
            let num = 1;
            for (let r = 0; r < SIZE; r++) {
                const row = [];
                for (let c = 0; c < SIZE; c++) {
                    if (r === SIZE - 1 && c === SIZE - 1) {
                        row.push(0); // empty
                    } else {
                        row.push(num++);
                    }
                }
                b.push(row);
            }
            return b;
        }

        // Check if board is solved (1-8 in order, empty at bottom-right)
        function isSolved(board) {
            let num = 1;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (r === SIZE - 1 && c === SIZE - 1) {
                        if (board[r][c] !== 0) return false;
                    } else {
                        if (board[r][c] !== num) return false;
                        num++;
                    }
                }
            }
            return true;
        }

        // Find empty position
        function findEmpty(board) {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) {
                        return { row: r, col: c };
                    }
                }
            }
            return null;
        }

        // Shuffle board with valid moves
        function shuffleBoard(board, movesCount = 200) {
            const directions = [
                [-1, 0], [1, 0], [0, -1], [0, 1]
            ];
            let empty = findEmpty(board);
            let lastMove = null;

            for (let i = 0; i < movesCount; i++) {
                const validMoves = [];
                for (let d of directions) {
                    const newRow = empty.row + d[0];
                    const newCol = empty.col + d[1];
                    if (newRow >= 0 && newRow < SIZE && newCol >= 0 && newCol < SIZE) {
                        if (lastMove && lastMove[0] === -d[0] && lastMove[1] === -d[1]) continue;
                        validMoves.push({ row: newRow, col: newCol, dr: d[0], dc: d[1] });
                    }
                }
                if (validMoves.length === 0) break;

                const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                board[empty.row][empty.col] = board[move.row][move.col];
                board[move.row][move.col] = 0;
                empty = { row: move.row, col: move.col };
                lastMove = [move.dr, move.dc];
            }

            if (isSolved(board)) {
                const r1 = Math.floor(Math.random() * SIZE);
                const c1 = Math.floor(Math.random() * SIZE);
                let r2 = Math.floor(Math.random() * SIZE);
                let c2 = Math.floor(Math.random() * SIZE);
                while (r1 === r2 && c1 === c2) {
                    r2 = Math.floor(Math.random() * SIZE);
                    c2 = Math.floor(Math.random() * SIZE);
                }
                const temp = board[r1][c1];
                board[r1][c1] = board[r2][c2];
                board[r2][c2] = temp;
                const newEmpty = findEmpty(board);
                if (newEmpty) empty = newEmpty;
            }

            return { board, empty };
        }

        // Render board
        function renderBoard(board) {
            boardElement.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    const value = board[r][c];
                    if (value === 0) {
                        cell.className = 'cell empty';
                        cell.textContent = '';
                    } else {
                        cell.className = `cell tile-${value}`;
                        cell.textContent = value;
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', () => onCellClick(r, c));
                    }
                    boardElement.appendChild(cell);
                }
            }
        }

        // Check if tile can move
        function canMove(row, col) {
            const empty = findEmpty(board);
            if (!empty) return false;
            const rowDiff = Math.abs(row - empty.row);
            const colDiff = Math.abs(col - empty.col);
            return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
        }

        // Create confetti
        function createConfetti() {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);

            const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3', '#54a0ff', '#5f27cd', '#ff9f43', '#00d2d3'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = '-10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.width = (Math.random() * 8 + 6) + 'px';
                confetti.style.height = (Math.random() * 8 + 6) + 'px';
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 0.8) + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                container.appendChild(confetti);
            }

            setTimeout(() => {
                container.remove();
            }, 4000);
        }

        // Show number 9 with animation
        function showNumberNine() {
            const empty = findEmpty(board);
            if (!empty) return;

            // Set 9 in the empty position
            board[empty.row][empty.col] = 9;
            renderBoard(board);

            // Find the 9 cell and add animation
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (cell.textContent === '9') {
                    cell.classList.add('appear-nine');
                    // Add golden glow class
                    cell.style.animation = 'goldenGlow 1s infinite alternate';
                }
            });

            // Create confetti
            createConfetti();

            messageEl.textContent = '🎉✨ PERFECT! 9 IS HERE! ✨🎉';
            messageEl.style.color = '#ffd700';
            messageEl.style.textShadow = '0 0 40px #ffaa00, 0 0 80px #ff8800';
            isWinAnimationDone = true;
        }

        // Move tile
        function moveTile(row, col) {
            if (isAnimating) return;
            if (isGameOver) return;
            if (isWinAnimationDone) return;

            const empty = findEmpty(board);
            if (!empty) return;

            if (!canMove(row, col)) return;

            isAnimating = true;

            board[empty.row][empty.col] = board[row][col];
            board[row][col] = 0;
            moves++;
            movesSpan.textContent = moves;

            renderBoard(board);

            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                if (cell.textContent && parseInt(cell.textContent) === board[empty.row][empty.col]) {
                    cell.classList.add('sliding');
                }
            });

            // Check win
            if (isSolved(board)) {
                isGameOver = true;
                // Show number 9 with animation
                setTimeout(() => {
                    showNumberNine();
                    isAnimating = false;
                }, 300);
                return;
            }

            messageEl.textContent = '🎯 Keep going!';
            messageEl.style.color = '#f7e05e';
            messageEl.style.textShadow = '0 2px 8px #000000dd';

            setTimeout(() => {
                isAnimating = false;
            }, 250);
        }

        // Click handler
        function onCellClick(row, col) {
            moveTile(row, col);
        }

        // Reset game
        function resetGame() {
            if (isAnimating) return;
            const solved = createSolvedBoard();
            const shuffled = shuffleBoard(solved, 150);
            board = shuffled.board;
            moves = 0;
            isGameOver = false;
            isWinAnimationDone = false;
            movesSpan.textContent = moves;
            messageEl.textContent = '🎯 Arrange numbers 1-8 in order!';
            messageEl.style.color = '#f7e05e';
            messageEl.style.textShadow = '0 2px 8px #000000dd';
            renderBoard(board);
        }

        // Init
        function init() {
            const solved = createSolvedBoard();
            const shuffled = shuffleBoard(solved, 150);
            board = shuffled.board;
            moves = 0;
            isGameOver = false;
            isWinAnimationDone = false;
            movesSpan.textContent = moves;
            renderBoard(board);
            document.getElementById('resetBtn').addEventListener('click', resetGame);
        }

        init();
    })();
</script>
</body>
</html>
