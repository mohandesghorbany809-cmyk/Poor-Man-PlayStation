<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎲 Heads or Tails</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0b0f1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            padding: 16px;
        }

        /* ===== MAIN CARD ===== */
        .container {
            background: rgba(20, 28, 50, 0.85);
            backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            border: 1px solid rgba(255, 215, 0, 0.12);
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 0 80px rgba(255, 215, 0, 0.02);
            text-align: center;
        }

        /* ===== BALANCE ===== */
        .balance {
            color: #ffd700;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.15);
            margin-bottom: 4px;
        }
        .balance-label {
            color: #6a7a9a;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        /* ===== COIN DISPLAY ===== */
        .coin-area {
            background: radial-gradient(circle at 30% 30%, #2a3050, #0e121f);
            border-radius: 999px;
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255, 215, 0, 0.08);
            box-shadow: inset 0 -10px 40px rgba(0, 0, 0, 0.6), 0 10px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.15s;
            user-select: none;
        }
        .coin-area.flip {
            animation: flipAnim 0.5s ease;
        }

        /* ===== FLIP ANIMATION ===== */
        @keyframes flipAnim {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(0.9); }
            100% { transform: rotateY(360deg) scale(1); }
        }

        .coin-text {
            font-size: 5rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            transition: 0.2s;
            line-height: 1;
        }
        .coin-text.tail {
            color: #7a8ab5;
            text-shadow: 0 0 40px rgba(120, 140, 200, 0.15);
        }

        /* ===== BET BUTTONS ===== */
        .bet-area {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .bet-btn {
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 10px 22px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            min-width: 80px;
        }
        .bet-btn:hover {
            background: rgba(255, 215, 0, 0.12);
            border-color: #ffd70066;
            transform: translateY(-2px);
        }
        .bet-btn.active {
            background: rgba(255, 215, 0, 0.18);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
        }
        .bet-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== GUESS BUTTONS ===== */
        .guess-area {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .guess-btn {
            background: rgba(60, 80, 140, 0.2);
            border: 1px solid rgba(100, 140, 255, 0.1);
            color: #b0c4f0;
            padding: 14px 44px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            flex: 1;
            max-width: 140px;
        }
        .guess-btn:hover:not(:disabled) {
            background: rgba(60, 100, 220, 0.25);
            border-color: #4a7aff66;
            transform: scale(1.02);
        }
        .guess-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
        }
        .guess-btn.gold {
            color: #ffd700;
            border-color: #ffd70033;
        }
        .guess-btn.gold:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.08);
            border-color: #ffd70066;
        }

        /* ===== RESULT BOX ===== */
        .result-box {
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: #8a9ac0;
            margin: 8px 0 16px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 16px;
            transition: 0.3s;
            border: 1px solid transparent;
        }
        .result-box.win {
            color: #ffd700;
            border-color: #ffd70022;
            background: rgba(255, 215, 0, 0.04);
        }
        .result-box.lose {
            color: #ff6b6b88;
            border-color: #ff6b6b22;
            background: rgba(255, 0, 0, 0.03);
        }

        /* ===== HISTORY ===== */
        .history {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .history-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #4a5a7a;
        }
        .history-dot.win {
            border-color: #ffd70033;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.06);
        }
        .history-dot.lose {
            border-color: #ff6b6b22;
            color: #ff6b6b66;
            background: rgba(255, 0, 0, 0.03);
        }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            justify-content: space-between;
            color: #4a5a7a;
            font-size: 0.75rem;
            margin-top: 14px;
            letter-spacing: 0.5px;
        }
        .stats span {
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 14px;
            border-radius: 40px;
        }

        /* ===== RESET ===== */
        .reset-area {
            margin-top: 8px;
        }
        .reset-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: #4a5a7a;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .reset-btn:hover {
            border-color: #4a5a7a44;
            color: #8a9ac0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 420px) {
            .container {
                padding: 28px 18px;
            }
            .coin-area {
                width: 130px;
                height: 130px;
            }
            .coin-text {
                font-size: 4rem;
            }
            .guess-btn {
                padding: 12px 20px;
                font-size: 1.2rem;
                max-width: 100px;
            }
            .bet-btn {
                padding: 8px 16px;
                font-size: 0.9rem;
                min-width: 60px;
            }
            .balance {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- ===== BALANCE DISPLAY ===== -->
        <div class="balance" id="balanceDisplay">1000</div>
        <div class="balance-label">💰 Balance</div>

        <!-- ===== COIN ===== -->
        <div class="coin-area" id="coinArea">
            <div class="coin-text" id="coinText">?</div>
        </div>

        <!-- ===== BET SELECTION ===== -->
        <div class="bet-area" id="betArea">
            <button class="bet-btn" data-bet="50">50</button>
            <button class="bet-btn active" data-bet="100">100</button>
            <button class="bet-btn" data-bet="250">250</button>
            <button class="bet-btn" data-bet="500">500</button>
        </div>

        <!-- ===== GUESS BUTTONS ===== -->
        <div class="guess-area">
            <button class="guess-btn gold" id="guessHead" disabled>🦅 Heads</button>
            <button class="guess-btn" id="guessTail" disabled>🪙 Tails</button>
        </div>

        <!-- ===== RESULT ===== -->
        <div class="result-box" id="resultBox">👆 Place a bet & guess</div>

        <!-- ===== HISTORY & STATS ===== -->
        <div class="history" id="historyContainer"></div>

        <div class="stats">
            <span id="winCount">🏆 Wins: 0</span>
            <span id="totalCount">🎯 Total: 0</span>
        </div>

        <!-- ===== RESET ===== -->
        <div class="reset-area">
            <button class="reset-btn" id="resetBtn">🔄 Full Reset</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  🎲  HEADS OR TAILS  –  Professional Edition
        //  Features: 3D coin flip animation, bet system, history, stats
        // ================================================================

        // ================================================================
        //  1.  GAME STATE
        // ================================================================
        const state = {
            balance: 1000,              // Current balance
            betAmount: 100,             // Selected bet amount
            currentResult: null,        // 'win' | 'lose' | null
            history: [],                // Array of 'win' or 'lose'
            isFlipping: false,          // Lock during animation
            totalGames: 0,              // Total rounds played
            wins: 0,                   // Total wins
        };

        // ================================================================
        //  2.  DOM REFERENCES
        // ================================================================
        const balanceEl = document.getElementById('balanceDisplay');
        const coinArea = document.getElementById('coinArea');
        const coinText = document.getElementById('coinText');
        const resultBox = document.getElementById('resultBox');
        const historyContainer = document.getElementById('historyContainer');
        const winCountEl = document.getElementById('winCount');
        const totalCountEl = document.getElementById('totalCount');

        const guessHead = document.getElementById('guessHead');
        const guessTail = document.getElementById('guessTail');
        const betBtns = document.querySelectorAll('.bet-btn');
        const resetBtn = document.getElementById('resetBtn');

        // ================================================================
        //  3.  UTILITY FUNCTIONS
        // ================================================================

        // Format number with Persian/English thousands separator
        function formatNumber(n) {
            return n.toLocaleString('en-US');
        }

        // ================================================================
        //  4.  UI UPDATE
        // ================================================================
        function updateUI() {
            // Update balance
            balanceEl.textContent = formatNumber(state.balance);

            // Update stats
            winCountEl.textContent = `🏆 Wins: ${state.wins}`;
            totalCountEl.textContent = `🎯 Total: ${state.totalGames}`;

            // Enable/disable guess buttons based on balance & flip state
            const canBet = state.balance >= state.betAmount && !state.isFlipping;
            guessHead.disabled = !canBet;
            guessTail.disabled = !canBet;

            // Update bet buttons (highlight active, disable unaffordable)
            betBtns.forEach(btn => {
                const val = parseInt(btn.dataset.bet);
                btn.classList.toggle('active', val === state.betAmount);
                btn.disabled = state.isFlipping || state.balance < val;
            });

            // Render history
            renderHistory();
        }

        // ================================================================
        //  5.  HISTORY RENDER  (shows last 20 results)
        // ================================================================
        function renderHistory() {
            const show = state.history.slice(-20);
            historyContainer.innerHTML = show.map(h =>
                `<div class="history-dot ${h}">${h === 'win' ? '✓' : '✗'}</div>`
            ).join('');
        }

        // ================================================================
        //  6.  COIN FLIP ANIMATION
        // ================================================================
        function flipCoin(callback) {
            if (state.isFlipping) return;
            state.isFlipping = true;

            // Trigger flip animation
            coinArea.classList.remove('flip');
            void coinArea.offsetWidth; // Force reflow for animation restart
            coinArea.classList.add('flip');

            // Determine result after animation completes
            setTimeout(() => {
                const isHead = Math.random() < 0.5;
                coinText.textContent = isHead ? '🦅' : '🪙';
                coinText.className = 'coin-text' + (isHead ? '' : ' tail');
                callback(isHead);
                state.isFlipping = false;
                updateUI();
            }, 500);
        }

        // ================================================================
        //  7.  MAIN GAME LOGIC
        // ================================================================
        function playRound(guess) { // guess: 'head' or 'tail'
            // Prevent multiple simultaneous plays
            if (state.isFlipping) return;

            // Check if balance can cover the bet
            if (state.balance < state.betAmount) {
                resultBox.textContent = '❌ Insufficient balance!';
                resultBox.className = 'result-box lose';
                return;
            }

            // Disable all buttons during flip
            guessHead.disabled = true;
            guessTail.disabled = true;
            betBtns.forEach(b => b.disabled = true);

            resultBox.className = 'result-box';
            resultBox.textContent = '🌀 Flipping...';

            // Perform the flip
            flipCoin((isHead) => {
                // Determine win/loss
                const won = (guess === 'head' && isHead) || (guess === 'tail' && !isHead);

                if (won) {
                    // Win: add bet amount (net gain = betAmount, because you keep your original)
                    state.balance += state.betAmount;
                    state.wins++;
                    state.history.push('win');
                    resultBox.textContent = `🎉 You won! +${formatNumber(state.betAmount)} coins!`;
                    resultBox.className = 'result-box win';
                } else {
                    // Lose: subtract bet amount
                    state.balance -= state.betAmount;
                    state.history.push('lose');
                    resultBox.textContent = `😔 You lost! -${formatNumber(state.betAmount)} coins.`;
                    resultBox.className = 'result-box lose';
                }

                state.totalGames++;

                // Auto-adjust bet if balance is lower than current bet
                if (state.balance < state.betAmount && state.balance > 0) {
                    const minBet = Math.min(50, state.balance);
                    if (minBet > 0) {
                        state.betAmount = minBet;
                    }
                }

                // Check for bankruptcy
                if (state.balance <= 0) {
                    state.balance = 0;
                    resultBox.textContent = '💀 You went bankrupt! Hit reset.';
                    resultBox.className = 'result-box lose';
                }

                updateUI();
                // Buttons re-enabled by updateUI()
            });
        }

        // ================================================================
        //  8.  RESET GAME
        // ================================================================
        function resetGame() {
            if (state.isFlipping) return;

            state.balance = 1000;
            state.betAmount = 100;
            state.history = [];
            state.totalGames = 0;
            state.wins = 0;
            state.currentResult = null;

            coinText.textContent = '?';
            coinText.className = 'coin-text';
            resultBox.textContent = '🔄 Game reset!';
            resultBox.className = 'result-box';

            updateUI();
        }

        // ================================================================
        //  9.  EVENT LISTENERS
        // ================================================================

        // --- Bet selection buttons ---
        betBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                if (state.isFlipping) return;
                const val = parseInt(btn.dataset.bet);
                if (state.balance >= val) {
                    state.betAmount = val;
                    updateUI();
                } else {
                    resultBox.textContent = `⚠️ Not enough balance for ${formatNumber(val)}.`;
                    resultBox.className = 'result-box lose';
                }
            });
        });

        // --- Guess: Heads ---
        guessHead.addEventListener('click', () => playRound('head'));

        // --- Guess: Tails ---
        guessTail.addEventListener('click', () => playRound('tail'));

        // --- Reset button ---
        resetBtn.addEventListener('click', resetGame);

        // ================================================================
        //  10.  INITIALIZATION
        // ================================================================
        updateUI();
        resultBox.textContent = '💰 Select your bet and guess!';
    </script>
</body>
</html>
