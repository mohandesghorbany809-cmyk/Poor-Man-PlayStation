<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🧩 Tetris</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #0a0f18;
            --text-primary: #b0d0ec;
            --text-secondary: #8aaac0;
            --text-highlight: #ffd966;
            --border-color: rgba(255,255,255,0.06);
            --shadow-color: rgba(0,0,0,0.8);
            --btn-bg: rgba(255,255,255,0.06);
            --board-bg: #0a0f18;
            --canvas-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        [data-theme="light"] {
            --bg-primary: #e8ecf1;
            --bg-secondary: #d5dce4;
            --bg-card: #f0f4f8;
            --text-primary: #1a2a3e;
            --text-secondary: #3a4a5e;
            --text-highlight: #e67e22;
            --border-color: rgba(0,0,0,0.1);
            --shadow-color: rgba(0,0,0,0.2);
            --btn-bg: rgba(0,0,0,0.05);
            --board-bg: #f0f4f8;
            --canvas-shadow: inset 0 0 30px rgba(0,0,0,0.08);
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 8px;
            touch-action: none;
            transition: background 0.3s ease;
            overflow: hidden;
        }

        .game-wrap {
            background: var(--bg-secondary);
            border-radius: 28px;
            padding: 16px 12px;
            box-shadow: 0 20px 40px var(--shadow-color);
            max-width: 440px;
            width: 100%;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            gap: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 13px;
            transition: color 0.3s;
        }
        .stats span { 
            color: var(--text-highlight); 
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        .btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn:active { transform: scale(0.92); }
        .btn-primary {
            background: linear-gradient(145deg, #2a5a7a, #1a3a52);
            border-color: #4a7aaa;
            color: white;
        }
        [data-theme="light"] .btn-primary {
            background: linear-gradient(145deg, #4a8aaa, #2a6a8a);
            border-color: #6aaaca;
            color: white;
        }

        .theme-btn {
            background: var(--btn-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            touch-action: manipulation;
        }
        .theme-btn:active { transform: scale(0.92); }

        .game-area {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: nowrap;
        }

        .board-wrap {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 4px;
            box-shadow: var(--canvas-shadow);
            transition: all 0.3s;
            flex: 1;
            min-width: 0;
        }

        canvas#board {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 10 / 20;
            border-radius: 10px;
            background: var(--board-bg);
            transition: background 0.3s;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 72px;
            flex-shrink: 0;
        }

        .next-wrap {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 4px;
            box-shadow: var(--canvas-shadow);
            transition: all 0.3s;
        }

        canvas#next {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            background: var(--board-bg);
            transition: background 0.3s;
        }

        .next-label {
            color: var(--text-secondary);
            font-weight: 600;
            text-align: center;
            font-size: 11px;
            transition: color 0.3s;
            letter-spacing: 0.5px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: nowrap;
        }

        .ctrl-btn {
            background: var(--btn-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 0;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.1s;
            font-family: inherit;
            touch-action: manipulation;
            flex: 1;
            min-width: 44px;
            text-align: center;
            line-height: 1.4;
        }
        .ctrl-btn:active {
            transform: scale(0.88);
            background: rgba(255,255,255,0.12);
        }
        [data-theme="light"] .ctrl-btn:active {
            background: rgba(0,0,0,0.1);
        }

        /* special for drop button */
        .ctrl-btn.drop {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        @media (max-width: 480px) {
            .game-wrap {
                padding: 12px 8px;
                border-radius: 20px;
            }
            .title {
                font-size: 16px;
            }
            .stats {
                font-size: 11px;
                gap: 8px;
            }
            .header-right {
                gap: 5px;
            }
            .btn {
                font-size: 10px;
                padding: 4px 10px;
            }
            .sidebar {
                min-width: 60px;
            }
            .ctrl-btn {
                font-size: 15px;
                padding: 6px 0;
                min-width: 36px;
                border-radius: 12px;
            }
            .ctrl-btn.drop {
                font-size: 13px;
            }
            .next-label {
                font-size: 10px;
            }
        }

        @media (max-width: 380px) {
            .game-wrap {
                padding: 8px 5px;
            }
            .sidebar {
                min-width: 50px;
            }
            .ctrl-btn {
                font-size: 13px;
                padding: 5px 0;
                min-width: 30px;
            }
            .stats {
                font-size: 10px;
                gap: 5px;
            }
            .title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="game-wrap" id="app">
    <div class="header">
        <div class="title">🧩 Tetris</div>
        <div class="header-right">
            <div class="stats">
                Score: <span id="scoreDisplay">0</span>
                Lines: <span id="linesDisplay">0</span>
            </div>
            <button class="theme-btn" id="themeBtn">🌙</button>
            <button class="btn btn-primary" id="startBtn">▶ Start</button>
        </div>
    </div>

    <div class="game-area">
        <div class="board-wrap">
            <canvas id="board" width="200" height="400"></canvas>
        </div>
        <div class="sidebar">
            <div class="next-wrap">
                <canvas id="next" width="120" height="120"></canvas>
            </div>
            <div class="next-label">NEXT</div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="leftBtn">◀</button>
        <button class="ctrl-btn" id="rotateBtn">🔄</button>
        <button class="ctrl-btn" id="downBtn">▼</button>
        <button class="ctrl-btn" id="rightBtn">▶</button>
        <button class="ctrl-btn drop" id="dropBtn">⬇⬇</button>
    </div>
</div>

<script>
    (function() {
        // ---- Theme ----
        let currentTheme = 'dark';
        const themeBtn = document.getElementById('themeBtn');

        function toggleTheme() {
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                currentTheme = 'light';
                themeBtn.textContent = '☀️';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                currentTheme = 'dark';
                themeBtn.textContent = '🌙';
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        themeBtn.addEventListener('touchstart', (e) => { e.preventDefault(); toggleTheme(); });

        // ---- Canvas setup ----
        const boardCanvas = document.getElementById('board');
        const boardCtx = boardCanvas.getContext('2d');
        const nextCanvas = document.getElementById('next');
        const nextCtx = nextCanvas.getContext('2d');

        const B_W = 10, B_H = 20;
        const CELL_SIZE = 20;

        // ---- Tetrominoes ----
        const SHAPES = [
            { blocks: [[1,1,1,1]], color: '#00f0f0' },
            { blocks: [[1,1],[1,1]], color: '#f0f000' },
            { blocks: [[0,1,0],[1,1,1]], color: '#a000f0' },
            { blocks: [[0,1,1],[1,1,0]], color: '#00f000' },
            { blocks: [[1,1,0],[0,1,1]], color: '#f00000' },
            { blocks: [[1,0,0],[1,1,1]], color: '#f0a000' },
            { blocks: [[0,0,1],[1,1,1]], color: '#0000f0' }
        ];

        // ---- Game state ----
        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let lines = 0;
        let gameRunning = false;
        let gameOver = false;
        let dropInterval = null;
        let animId = null;

        // ---- DOM ----
        const scoreDisplay = document.getElementById('scoreDisplay');
        const linesDisplay = document.getElementById('linesDisplay');
        const startBtn = document.getElementById('startBtn');

        // ---- Initialize ----
        function initBoard() {
            board = [];
            for (let row = 0; row < B_H; row++) {
                board[row] = [];
                for (let col = 0; col < B_W; col++) {
                    board[row][col] = null;
                }
            }
        }

        // ---- Create piece ----
        function createPiece(shapeIndex) {
            const shape = SHAPES[shapeIndex];
            const blocks = shape.blocks.map(row => [...row]);
            return {
                blocks: blocks,
                color: shape.color,
                x: Math.floor((B_W - blocks[0].length) / 2),
                y: 0,
                shapeIndex: shapeIndex
            };
        }

        function randomPiece() {
            const idx = Math.floor(Math.random() * SHAPES.length);
            return createPiece(idx);
        }

        // ---- Collision ----
        function collides(piece, board, offsetX = 0, offsetY = 0) {
            for (let row = 0; row < piece.blocks.length; row++) {
                for (let col = 0; col < piece.blocks[row].length; col++) {
                    if (piece.blocks[row][col]) {
                        const newX = piece.x + col + offsetX;
                        const newY = piece.y + row + offsetY;
                        if (newX < 0 || newX >= B_W || newY >= B_H || newY < 0) return true;
                        if (newY >= 0 && board[newY][newX] !== null) return true;
                    }
                }
            }
            return false;
        }

        // ---- Lock piece ----
        function lockPiece() {
            for (let row = 0; row < currentPiece.blocks.length; row++) {
                for (let col = 0; col < currentPiece.blocks[row].length; col++) {
                    if (currentPiece.blocks[row][col]) {
                        const boardX = currentPiece.x + col;
                        const boardY = currentPiece.y + row;
                        if (boardY < 0) {
                            gameOver = true;
                            stopGame();
                            return;
                        }
                        board[boardY][boardX] = currentPiece.color;
                    }
                }
            }
            clearLines();
            spawnPiece();
        }

        // ---- Clear lines ----
        function clearLines() {
            let cleared = 0;
            for (let row = B_H - 1; row >= 0; ) {
                let full = true;
                for (let col = 0; col < B_W; col++) {
                    if (board[row][col] === null) {
                        full = false;
                        break;
                    }
                }
                if (full) {
                    board.splice(row, 1);
                    board.unshift(new Array(B_W).fill(null));
                    cleared++;
                } else {
                    row--;
                }
            }

            if (cleared > 0) {
                const points = [0, 100, 300, 500, 800];
                score += points[cleared] || 800;
                lines += cleared;
                updateStats();
            }
        }

        // ---- Spawn ----
        function spawnPiece() {
            if (nextPiece === null) {
                nextPiece = randomPiece();
            }
            currentPiece = {
                blocks: nextPiece.blocks.map(row => [...row]),
                color: nextPiece.color,
                x: Math.floor((B_W - nextPiece.blocks[0].length) / 2),
                y: 0,
                shapeIndex: nextPiece.shapeIndex
            };
            nextPiece = randomPiece();

            if (collides(currentPiece, board)) {
                gameOver = true;
                stopGame();
            }
        }

        // ---- Move ----
        function moveLeft() {
            if (!gameRunning || gameOver) return;
            if (!collides(currentPiece, board, -1, 0)) {
                currentPiece.x--;
                draw();
            }
        }

        function moveRight() {
            if (!gameRunning || gameOver) return;
            if (!collides(currentPiece, board, 1, 0)) {
                currentPiece.x++;
                draw();
            }
        }

        function moveDown() {
            if (!gameRunning || gameOver) return;
            if (!collides(currentPiece, board, 0, 1)) {
                currentPiece.y++;
                draw();
            } else {
                lockPiece();
                draw();
                if (gameOver) {
                    stopGame();
                    draw();
                }
            }
        }

        function rotatePiece() {
            if (!gameRunning || gameOver) return;
            const blocks = currentPiece.blocks;
            const rotated = blocks[0].map((_, idx) => blocks.map(row => row[idx]).reverse());
            const oldBlocks = currentPiece.blocks;
            currentPiece.blocks = rotated;
            if (collides(currentPiece, board)) {
                currentPiece.blocks = oldBlocks;
            }
            draw();
        }

        function hardDrop() {
            if (!gameRunning || gameOver) return;
            while (!collides(currentPiece, board, 0, 1)) {
                currentPiece.y++;
            }
            lockPiece();
            draw();
            if (gameOver) {
                stopGame();
                draw();
            }
        }

        // ---- Drawing ----
        function draw() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';
            const textColor = isLight ? '#1a2a3e' : '#ff6b6b';

            // Board
            boardCtx.clearRect(0, 0, 200, 400);
            for (let row = 0; row < B_H; row++) {
                for (let col = 0; col < B_W; col++) {
                    const color = board[row][col];
                    if (color) {
                        boardCtx.fillStyle = color;
                        boardCtx.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                        boardCtx.strokeStyle = 'rgba(0,0,0,0.2)';
                        boardCtx.lineWidth = 0.5;
                        boardCtx.strokeRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // Current piece
            if (currentPiece) {
                for (let row = 0; row < currentPiece.blocks.length; row++) {
                    for (let col = 0; col < currentPiece.blocks[row].length; col++) {
                        if (currentPiece.blocks[row][col]) {
                            const x = (currentPiece.x + col) * CELL_SIZE;
                            const y = (currentPiece.y + row) * CELL_SIZE;
                            boardCtx.fillStyle = currentPiece.color;
                            boardCtx.fillRect(x, y, CELL_SIZE, CELL_SIZE);
                            boardCtx.strokeStyle = 'rgba(0,0,0,0.2)';
                            boardCtx.lineWidth = 0.5;
                            boardCtx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
                        }
                    }
                }
            }

            // Grid lines
            boardCtx.strokeStyle = gridColor;
            boardCtx.lineWidth = 0.5;
            for (let i = 0; i <= B_W; i++) {
                boardCtx.beginPath();
                boardCtx.moveTo(i * CELL_SIZE, 0);
                boardCtx.lineTo(i * CELL_SIZE, 400);
                boardCtx.stroke();
            }
            for (let i = 0; i <= B_H; i++) {
                boardCtx.beginPath();
                boardCtx.moveTo(0, i * CELL_SIZE);
                boardCtx.lineTo(200, i * CELL_SIZE);
                boardCtx.stroke();
            }

            // Game over overlay
            if (gameOver) {
                boardCtx.fillStyle = 'rgba(0,0,0,0.6)';
                boardCtx.fillRect(0, 150, 200, 100);
                boardCtx.fillStyle = textColor;
                boardCtx.font = 'bold 24px "Segoe UI", sans-serif';
                boardCtx.textAlign = 'center';
                boardCtx.textBaseline = 'middle';
                boardCtx.fillText('GAME OVER', 100, 200);
            }

            // Next piece
            nextCtx.clearRect(0, 0, 120, 120);
            if (nextPiece) {
                const blocks = nextPiece.blocks;
                const cols = blocks[0].length;
                const rows = blocks.length;
                const cellSize = 24;
                const offsetX = (120 - cols * cellSize) / 2;
                const offsetY = (120 - rows * cellSize) / 2;
                for (let row = 0; row < rows; row++) {
                    for (let col = 0; col < cols; col++) {
                        if (blocks[row][col]) {
                            nextCtx.fillStyle = nextPiece.color;
                            nextCtx.fillRect(offsetX + col * cellSize, offsetY + row * cellSize, cellSize, cellSize);
                            nextCtx.strokeStyle = 'rgba(0,0,0,0.2)';
                            nextCtx.lineWidth = 0.5;
                            nextCtx.strokeRect(offsetX + col * cellSize, offsetY + row * cellSize, cellSize, cellSize);
                        }
                    }
                }
            }
        }

        // ---- Stats ----
        function updateStats() {
            scoreDisplay.textContent = score;
            linesDisplay.textContent = lines;
        }

        // ---- Game control ----
        function startGame() {
            if (gameRunning) return;
            initBoard();
            score = 0;
            lines = 0;
            gameOver = false;
            gameRunning = true;
            updateStats();
            nextPiece = randomPiece();
            spawnPiece();
            draw();
            startBtn.textContent = '⏳ Playing...';

            if (dropInterval) clearInterval(dropInterval);
            dropInterval = setInterval(() => {
                if (gameRunning && !gameOver) {
                    moveDown();
                }
            }, 500);

            if (animId) cancelAnimationFrame(animId);
            gameLoop();
        }

        function stopGame() {
            gameRunning = false;
            if (dropInterval) clearInterval(dropInterval);
            startBtn.textContent = '🔄 Again';
        }

        function gameLoop() {
            if (gameRunning || gameOver) {
                animId = requestAnimationFrame(gameLoop);
            }
        }

        // ---- Keyboard ----
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft': e.preventDefault(); moveLeft(); break;
                case 'ArrowRight': e.preventDefault(); moveRight(); break;
                case 'ArrowDown': e.preventDefault(); moveDown(); break;
                case 'ArrowUp': e.preventDefault(); rotatePiece(); break;
                case ' ': e.preventDefault(); hardDrop(); break;
            }
        });

        // ---- Buttons ----
        document.getElementById('leftBtn').addEventListener('click', moveLeft);
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById('rightBtn').addEventListener('click', moveRight);
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveRight(); });
        document.getElementById('downBtn').addEventListener('click', moveDown);
        document.getElementById('downBtn').addEventListener('touchstart', (e) => { e.preventDefault(); moveDown(); });
        document.getElementById('rotateBtn').addEventListener('click', rotatePiece);
        document.getElementById('rotateBtn').addEventListener('touchstart', (e) => { e.preventDefault(); rotatePiece(); });
        document.getElementById('dropBtn').addEventListener('click', hardDrop);
        document.getElementById('dropBtn').addEventListener('touchstart', (e) => { e.preventDefault(); hardDrop(); });

        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });

        // ---- Listen for theme changes to redraw ----
        const observer = new MutationObserver(() => draw());
        observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        // ---- Start ----
        initBoard();
        draw();
        updateStats();
        startBtn.textContent = '▶ Start';
    })();
</script>
</body>
</html>
