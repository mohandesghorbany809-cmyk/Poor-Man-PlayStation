<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Mastermind - Color Code</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #1e2b3c, #0f1a26);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }
        .game-container {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 32px 28px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,0,0.15);
        }
        h1 {
            text-align: center;
            font-weight: 400;
            letter-spacing: 2px;
            color: #f5e9c4;
            text-shadow: 0 4px 10px #00000055;
            font-size: 2.1rem;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h1 span {
            background: #d4af37;
            color: #1e2b3c;
            font-size: 1.8rem;
            padding: 0 18px;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: inset 0 -3px 0 #7a621b;
        }
        .target-area {
            background: #1d2a36;
            border-radius: 60px;
            padding: 22px 18px;
            margin-bottom: 24px;
            border: 1px solid #3b4d5e;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.5);
        }
        .code-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 18px 22px;
        }
        .color-dot {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            box-shadow: 0 6px 0 #0b1219, 0 8px 16px #00000080;
            transition: 0.2s;
            border: 2px solid #5b6f80;
            position: relative;
        }
        .color-dot .position-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ffd966;
            color: #1e2b3c;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px #00000099;
            border: 2px solid #0f1a26;
        }
        .secret-placeholder {
            background: #2c3d4b;
            border: 2px dashed #b9c7d4;
            color: #b9c7d4;
            font-size: 1.2rem;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px #5b6f80;
            position: relative;
        }
        .feedback-panel {
            background: #0f1a24;
            border-radius: 40px;
            padding: 18px 16px;
            margin: 18px 0 22px;
            border-left: 4px solid #d4af37;
            box-shadow: inset 0 2px 8px #00000066;
        }
        .feedback-text {
            color: #e6dbc8;
            font-size: 1.3rem;
            text-align: center;
            min-height: 3.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 18px;
        }
        .feedback-badge {
            background: #2b3f4e;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            color: #f5e9c4;
            border: 1px solid #5c7385;
        }
        .guess-area {
            background: #18232e;
            border-radius: 80px;
            padding: 18px 16px;
            margin-bottom: 25px;
            border: 1px solid #3d5365;
        }
        .color-selector {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px 16px;
        }
        .color-option {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.15s;
            box-shadow: 0 4px 0 #0b1219, 0 6px 12px #00000070;
        }
        .color-option:hover {
            transform: scale(1.12);
            border-color: #f5e9c4;
        }
        .color-option.active {
            border-color: #ffd966;
            transform: scale(1.12);
            box-shadow: 0 0 16px #ffd966aa;
        }
        .guess-btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px 18px;
            margin-top: 22px;
        }
        .btn {
            background: #2c3f50;
            border: none;
            border-radius: 60px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #f0e7d6;
            box-shadow: 0 6px 0 #0f1a24, 0 6px 12px #00000060;
            cursor: pointer;
            transition: all 0.08s linear;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #5c7487;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #0f1a24;
        }
        .btn-primary {
            background: #d4af37;
            color: #1e2b3c;
            border-color: #f5d76e;
            box-shadow: 0 6px 0 #7a621b;
            font-weight: 700;
        }
        .btn-primary:active {
            box-shadow: 0 1px 0 #7a621b;
        }
        .btn-secondary {
            background: #3d5365;
            border-color: #6d8599;
        }
        .btn-success {
            background: #2d7a4b;
            border-color: #4ca86b;
            box-shadow: 0 6px 0 #124d2b;
        }
        .history-area {
            background: #0e1721;
            border-radius: 40px;
            padding: 16px 12px;
            margin-top: 20px;
            border: 1px solid #334b5c;
        }
        .history-title {
            color: #b6c9d9;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-align: center;
            margin: 0 0 12px 0;
            opacity: 0.7;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 150px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .history-item {
            background: #1d2b38;
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 12px;
            border-left: 3px solid #d4af37;
            color: #d4dce6;
        }
        .history-colors {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .mini-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid #50687c;
            position: relative;
        }
        .mini-dot .mini-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ffd966;
            color: #0f1a26;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 0.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #0f1a26;
        }
        .history-feedback {
            background: #0b141e;
            padding: 2px 18px;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #f5e9c4;
        }
        .win-message {
            background: #2d7a4b;
            color: #f5f0e0;
            padding: 8px 22px;
            border-radius: 60px;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 0 20px #4ca86b77;
        }
        .footer-small {
            text-align: center;
            color: #658195;
            margin-top: 18px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1a26;
            border-radius: 20px;
        }
        ::-webkit-scrollbar-thumb {
            background: #5b6f80;
            border-radius: 20px;
        }
        @media (max-width: 500px) {
            .game-container { padding: 20px 12px; }
            .color-dot { width: 46px; height: 46px; }
            .color-option { width: 40px; height: 40px; }
            .secret-placeholder { width: 46px; height: 46px; font-size: 1rem; }
            .color-dot .position-badge { width: 22px; height: 22px; font-size: 0.65rem; top: -8px; right: -8px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>
        🧩 <span>Mastermind</span>
    </h1>

    <!-- Secret code display -->
    <div class="target-area">
        <div class="code-row" id="secretCodeDisplay">
            <div class="secret-placeholder">?</div>
            <div class="secret-placeholder">?</div>
            <div class="secret-placeholder">?</div>
            <div class="secret-placeholder">?</div>
        </div>
    </div>

    <!-- Feedback -->
    <div class="feedback-panel">
        <div class="feedback-text" id="feedbackMessage">
            <span>🔍 Guess the 4-color code</span>
        </div>
    </div>

    <!-- Color picker + buttons -->
    <div class="guess-area">
        <div class="color-selector" id="colorSelector"></div>
        <div class="guess-btn-group">
            <button class="btn btn-primary" id="guessBtn">✨ Guess</button>
            <button class="btn btn-secondary" id="resetBtn">🔄 New Code</button>
        </div>
    </div>

    <!-- History -->
    <div class="history-area">
        <div class="history-title">📋 Guess History</div>
        <div class="history-list" id="historyList">
            <div style="text-align:center; color:#5f7689; padding:10px;">No guesses yet</div>
        </div>
    </div>
    <div class="footer-small">● Colors may repeat ●</div>
</div>

<script>
    (function(){
        // ---------- Game config ----------
        const COLORS = [
            { name: 'Red', hex: '#d94f4f' },
            { name: 'Blue', hex: '#4a7db5' },
            { name: 'Green', hex: '#4caf7a' },
            { name: 'Yellow', hex: '#f5c542' },
            { name: 'Purple', hex: '#9b6fc0' },
            { name: 'Orange', hex: '#e88a4a' }
        ];

        const CODE_LENGTH = 4;
        let secretCode = [];
        let currentGuess = [];
        let guessHistory = [];
        let gameWon = false;
        let correctPositionsRevealed = []; // to track which positions are correct

        // DOM elements
        const secretDisplay = document.getElementById('secretCodeDisplay');
        const feedbackEl = document.getElementById('feedbackMessage');
        const colorSelector = document.getElementById('colorSelector');
        const historyList = document.getElementById('historyList');
        const guessBtn = document.getElementById('guessBtn');
        const resetBtn = document.getElementById('resetBtn');

        // ---------- Helpers ----------
        function generateRandomCode() {
            const code = [];
            for (let i = 0; i < CODE_LENGTH; i++) {
                code.push(Math.floor(Math.random() * COLORS.length));
            }
            return code;
        }

        function resetGame() {
            secretCode = generateRandomCode();
            currentGuess = [];
            guessHistory = [];
            gameWon = false;
            correctPositionsRevealed = [];
            renderSecretCode();
            renderColorSelector();
            renderHistory();
            updateFeedback('🔍 Guess the 4-color code', '');
            guessBtn.disabled = false;
            guessBtn.style.opacity = '1';
            document.querySelectorAll('.color-dot').forEach(d => d.style.borderColor = '#5b6f80');
        }

        // Show secret code (with position badges if won)
        function renderSecretCode() {
            secretDisplay.innerHTML = '';
            for (let i = 0; i < CODE_LENGTH; i++) {
                const div = document.createElement('div');
                div.className = 'secret-placeholder';
                if (gameWon) {
                    const colorIndex = secretCode[i];
                    const colorHex = COLORS[colorIndex].hex;
                    div.style.background = colorHex;
                    div.style.border = '2px solid #f5e9c4';
                    div.textContent = '';
                    div.style.boxShadow = '0 0 20px #ffd966aa';
                    // Show position badge
                    const badge = document.createElement('span');
                    badge.className = 'position-badge';
                    badge.textContent = i + 1;
                    div.style.position = 'relative';
                    div.appendChild(badge);
                } else {
                    div.textContent = '?';
                }
                secretDisplay.appendChild(div);
            }
        }

        function renderColorSelector() {
            colorSelector.innerHTML = '';
            COLORS.forEach((color, index) => {
                const dot = document.createElement('div');
                dot.className = 'color-option';
                dot.style.background = color.hex;
                dot.dataset.index = index;
                dot.addEventListener('click', (e) => {
                    if (gameWon) {
                        updateFeedback('🎉 Game over! Press "New Code" to play again.', '');
                        return;
                    }
                    if (currentGuess.length >= CODE_LENGTH) {
                        currentGuess = [];
                        document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
                    }
                    currentGuess.push(index);
                    dot.classList.add('active');
                    updateSecretPlaceholderWithGuess();
                    if (currentGuess.length === CODE_LENGTH) {
                        updateFeedback(`✅ ${CODE_LENGTH} colors selected. Press "Guess".`, '');
                    } else {
                        updateFeedback(`🔍 ${currentGuess.length} selected, ${CODE_LENGTH - currentGuess.length} more.`, '');
                    }
                });
                colorSelector.appendChild(dot);
            });
        }

        function updateSecretPlaceholderWithGuess() {
            const placeholders = secretDisplay.querySelectorAll('.secret-placeholder');
            placeholders.forEach((el, idx) => {
                if (idx < currentGuess.length) {
                    const colorIndex = currentGuess[idx];
                    const colorHex = COLORS[colorIndex].hex;
                    el.style.background = colorHex;
                    el.style.border = '2px solid #f5e9c4';
                    el.textContent = '';
                    el.style.boxShadow = '0 0 12px #ffffff66';
                } else {
                    el.style.background = '#2c3d4b';
                    el.style.border = '2px dashed #b9c7d4';
                    el.textContent = '?';
                    el.style.boxShadow = 'inset 0 0 0 1px #5b6f80';
                }
            });
        }

        function evaluateGuess(guessArray) {
            const secretCopy = [...secretCode];
            const guessCopy = [...guessArray];
            let correctPosition = 0;
            let correctColor = 0;
            const posMatches = [];

            for (let i = 0; i < CODE_LENGTH; i++) {
                if (guessCopy[i] === secretCopy[i]) {
                    correctPosition++;
                    posMatches.push(i);
                    guessCopy[i] = null;
                    secretCopy[i] = null;
                }
            }
            for (let i = 0; i < CODE_LENGTH; i++) {
                if (guessCopy[i] !== null) {
                    const foundIndex = secretCopy.indexOf(guessCopy[i]);
                    if (foundIndex !== -1) {
                        correctColor++;
                        secretCopy[foundIndex] = null;
                    }
                }
            }
            return { correctPosition, correctColor, posMatches };
        }

        function handleGuess() {
            if (gameWon) {
                updateFeedback('🎉 You already won! Reset the game.', '');
                return;
            }
            if (currentGuess.length !== CODE_LENGTH) {
                updateFeedback(`⚠️ Select exactly ${CODE_LENGTH} colors. (${currentGuess.length} selected)`, '');
                return;
            }

            const result = evaluateGuess(currentGuess);
            const { correctPosition, correctColor, posMatches } = result;

            const historyEntry = {
                guess: [...currentGuess],
                correctPosition,
                correctColor,
                posMatches
            };
            guessHistory.push(historyEntry);
            renderHistory();

            if (correctPosition === CODE_LENGTH) {
                gameWon = true;
                correctPositionsRevealed = posMatches;
                renderSecretCode();
                updateFeedback('🎊🎉 Congratulations! You cracked the code! 🎉🎊', 'win');
                guessBtn.disabled = true;
                guessBtn.style.opacity = '0.6';
                document.querySelectorAll('.color-dot').forEach(d => d.style.borderColor = '#f5e9c4');
                return;
            }

            let feedbackText = `❌ ${correctPosition} correct position, ${correctColor} correct color wrong position.`;
            if (correctPosition === 0 && correctColor === 0) {
                feedbackText = '😬 None are correct! Try again.';
            } else if (correctPosition === 0 && correctColor > 0) {
                feedbackText = `🤔 ${correctColor} color(s) correct but wrong position.`;
            } else if (correctPosition > 0 && correctColor === 0) {
                feedbackText = `📍 ${correctPosition} in correct position(s), no other correct colors.`;
            }
            updateFeedback(feedbackText, '');

            currentGuess = [];
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
            renderSecretCode();
        }

        function renderHistory() {
            historyList.innerHTML = '';
            if (guessHistory.length === 0) {
                historyList.innerHTML = '<div style="text-align:center; color:#5f7689; padding:10px;">No guesses yet</div>';
                return;
            }
            const reversed = [...guessHistory].reverse();
            reversed.forEach((entry) => {
                const item = document.createElement('div');
                item.className = 'history-item';

                const colorsDiv = document.createElement('div');
                colorsDiv.className = 'history-colors';
                entry.guess.forEach((colorIndex, idx) => {
                    const dot = document.createElement('span');
                    dot.className = 'mini-dot';
                    dot.style.background = COLORS[colorIndex].hex;
                    // Show position badge if this position was correct
                    if (entry.posMatches && entry.posMatches.includes(idx)) {
                        const badge = document.createElement('span');
                        badge.className = 'mini-badge';
                        badge.textContent = '✓';
                        dot.style.position = 'relative';
                        dot.appendChild(badge);
                    }
                    colorsDiv.appendChild(dot);
                });

                const feedbackSpan = document.createElement('span');
                feedbackSpan.className = 'history-feedback';
                feedbackSpan.textContent = `📍${entry.correctPosition} 🔄${entry.correctColor}`;

                item.appendChild(colorsDiv);
                item.appendChild(feedbackSpan);
                historyList.appendChild(item);
            });
        }

        function updateFeedback(message, type) {
            feedbackEl.innerHTML = `<span>${message}</span>`;
            if (type === 'win') {
                feedbackEl.style.background = '#2d7a4b33';
                feedbackEl.style.borderRadius = '60px';
                feedbackEl.style.padding = '4px 12px';
            } else {
                feedbackEl.style.background = 'transparent';
                feedbackEl.style.padding = '0';
            }
        }

        // ---------- Init ----------
        function init() {
            resetGame();
            guessBtn.addEventListener('click', handleGuess);
            resetBtn.addEventListener('click', () => {
                resetGame();
                document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
                currentGuess = [];
                renderSecretCode();
                updateFeedback('🔍 New code generated! Start guessing.', '');
                guessBtn.disabled = false;
                guessBtn.style.opacity = '1';
            });
        }

        init();
    })();
</script>
</body>
</html>
