<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ Premium Calculator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #1a1f2e, #0b0e14);
            font-family: 'Inter', sans-serif;
            padding: 16px;
        }

        .calculator {
            background: linear-gradient(145deg, #1e2638, #141a28);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 2px 0 rgba(255, 255, 255, 0.06);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        /* Display */
        .display {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 28px;
            padding: 18px 24px 14px;
            margin-bottom: 22px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            box-shadow: 
                inset 0 4px 20px rgba(0, 0, 0, 0.6),
                0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
        }

        .display .expression {
            color: rgba(160, 180, 210, 0.6);
            font-size: 18px;
            font-weight: 400;
            min-height: 28px;
            letter-spacing: 0.5px;
            width: 100%;
            text-align: right;
            transition: all 0.2s ease;
            word-wrap: break-word;
            overflow-wrap: break-word;
            direction: ltr;
        }

        .display .result {
            color: #f0f4ff;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1px;
            width: 100%;
            text-align: right;
            transition: all 0.15s ease;
            text-shadow: 0 2px 10px rgba(100, 150, 255, 0.1);
            direction: ltr;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .display .result.shrink {
            font-size: 32px;
        }

        /* Buttons grid */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            padding: 18px 0;
            border: none;
            border-radius: 20px;
            font-size: 26px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            letter-spacing: 0.5px;
            box-shadow: 
                0 4px 0 rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.2);
            touch-action: manipulation;
            transform: translateY(0);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.3);
        }

        /* Number buttons */
        .btn-number {
            background: linear-gradient(145deg, #2a3348, #1d2538);
            color: #dce4f5;
            box-shadow: 
                0 4px 0 #0f1420,
                0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .btn-number:active {
            background: linear-gradient(145deg, #1d2538, #151b2a);
        }

        /* Operator buttons */
        .btn-operator {
            background: linear-gradient(145deg, #3d4a6a, #2a3450);
            color: #8ab4ff;
            box-shadow: 
                0 4px 0 #151d30,
                0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .btn-operator:active {
            background: linear-gradient(145deg, #2a3450, #1d2538);
        }

        /* Equals button */
        .btn-equals {
            background: linear-gradient(145deg, #4a7aff, #3a5fd9);
            color: white;
            box-shadow: 
                0 4px 0 #1a3a8a,
                0 8px 24px rgba(74, 122, 255, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            font-size: 32px;
        }

        .btn-equals:active {
            background: linear-gradient(145deg, #3a5fd9, #2a4abf);
            box-shadow: 0 0px 0 #1a3a8a;
        }

        /* Clear & Delete */
        .btn-clear {
            background: linear-gradient(145deg, #5a2a3a, #3d1a28);
            color: #ff7a8a;
            box-shadow: 
                0 4px 0 #2a0f18,
                0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .btn-clear:active {
            background: linear-gradient(145deg, #3d1a28, #2a0f18);
        }

        .btn-delete {
            background: linear-gradient(145deg, #3a3a50, #28283a);
            color: #aab0c8;
            box-shadow: 
                0 4px 0 #18182a,
                0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .btn-delete:active {
            background: linear-gradient(145deg, #28283a, #1a1a2a);
        }

        /* Special span for zero */
        .btn-zero {
            grid-column: span 2;
        }

        /* Hover effects (desktop only) */
        @media (hover: hover) {
            .btn-number:hover {
                background: linear-gradient(145deg, #323d58, #222b42);
            }
            .btn-operator:hover {
                background: linear-gradient(145deg, #4a5a7a, #323d58);
            }
            .btn-equals:hover {
                background: linear-gradient(145deg, #5a8aff, #4a6ae9);
                box-shadow: 0 4px 0 #1a3a8a, 0 8px 32px rgba(74, 122, 255, 0.5);
            }
            .btn-clear:hover {
                background: linear-gradient(145deg, #6a3a4a, #4a2a38);
            }
            .btn-delete:hover {
                background: linear-gradient(145deg, #4a4a62, #32324a);
            }
        }

        /* Animations */
        @keyframes pressPop {
            0% { transform: scale(1); }
            50% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }

        .btn-pop {
            animation: pressPop 0.2s ease;
        }

        @keyframes resultGlow {
            0% { text-shadow: 0 0 20px rgba(100, 180, 255, 0); }
            50% { text-shadow: 0 0 40px rgba(100, 180, 255, 0.3); }
            100% { text-shadow: 0 0 20px rgba(100, 180, 255, 0); }
        }

        .result-glow {
            animation: resultGlow 0.5s ease;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .calculator {
                padding: 20px 16px 24px;
                border-radius: 36px;
            }
            .display .result {
                font-size: 40px;
            }
            .display .result.shrink {
                font-size: 28px;
            }
            .btn {
                font-size: 22px;
                padding: 16px 0;
                border-radius: 16px;
            }
            .btn-equals {
                font-size: 28px;
            }
            .buttons {
                gap: 10px;
            }
        }

        @media (max-width: 380px) {
            .btn {
                font-size: 18px;
                padding: 14px 0;
            }
            .display .result {
                font-size: 34px;
            }
            .display .result.shrink {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="calculator">
    <!-- Display -->
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <!-- Buttons -->
    <div class="buttons">
        <button class="btn btn-clear" data-action="clear">AC</button>
        <button class="btn btn-delete" data-action="delete">⌫</button>
        <button class="btn btn-operator" data-action="operator" data-value="%">%</button>
        <button class="btn btn-operator" data-action="operator" data-value="/">÷</button>

        <button class="btn btn-number" data-action="number" data-value="7">7</button>
        <button class="btn btn-number" data-action="number" data-value="8">8</button>
        <button class="btn btn-number" data-action="number" data-value="9">9</button>
        <button class="btn btn-operator" data-action="operator" data-value="*">×</button>

        <button class="btn btn-number" data-action="number" data-value="4">4</button>
        <button class="btn btn-number" data-action="number" data-value="5">5</button>
        <button class="btn btn-number" data-action="number" data-value="6">6</button>
        <button class="btn btn-operator" data-action="operator" data-value="-">−</button>

        <button class="btn btn-number" data-action="number" data-value="1">1</button>
        <button class="btn btn-number" data-action="number" data-value="2">2</button>
        <button class="btn btn-number" data-action="number" data-value="3">3</button>
        <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

        <button class="btn btn-number btn-zero" data-action="number" data-value="0">0</button>
        <button class="btn btn-number" data-action="number" data-value=".">.</button>
        <button class="btn btn-equals" data-action="equals">=</button>
    </div>
</div>

<script>
    (function() {
        // ----- State -----
        let displayValue = '0';
        let expression = '';
        let firstOperand = null;
        let operator = null;
        let waitingForSecond = false;
        let justEvaluated = false;

        const resultEl = document.getElementById('result');
        const expressionEl = document.getElementById('expression');

        // ----- Update Display -----
        function updateDisplay() {
            // Format display value (limit length)
            let display = displayValue;
            if (display.length > 12) {
                // Try to show in scientific notation if too long
                if (!display.includes('e') && display.includes('.')) {
                    const num = parseFloat(display);
                    if (!isNaN(num) && isFinite(num)) {
                        display = num.toExponential(6);
                    }
                }
                if (display.length > 16) {
                    display = display.slice(0, 16) + '…';
                }
            }
            resultEl.textContent = display;
            
            // Shrink font if too long
            if (display.length > 10) {
                resultEl.classList.add('shrink');
            } else {
                resultEl.classList.remove('shrink');
            }

            // Update expression
            expressionEl.textContent = expression;
        }

        // ----- Input Number -----
        function inputNumber(value) {
            if (justEvaluated) {
                displayValue = '0';
                expression = '';
                justEvaluated = false;
            }

            if (waitingForSecond) {
                displayValue = value === '.' ? '0.' : value;
                waitingForSecond = false;
                return;
            }

            if (value === '.') {
                if (displayValue.includes('.')) return;
                displayValue += '.';
            } else {
                if (displayValue === '0' && value !== '.') {
                    displayValue = value;
                } else {
                    if (displayValue.length < 16) {
                        displayValue += value;
                    }
                }
            }
        }

        // ----- Input Operator -----
        function inputOperator(op) {
            justEvaluated = false;
            const current = parseFloat(displayValue);
            
            if (operator && !waitingForSecond) {
                // Chain calculation
                const result = calculate(firstOperand, current, operator);
                displayValue = String(result);
                firstOperand = result;
            } else {
                firstOperand = current;
            }

            operator = op;
            waitingForSecond = true;
            
            // Update expression
            expression = displayValue + ' ' + getOpSymbol(op) + ' ';
            updateDisplay();
        }

        // ----- Calculate -----
        function calculate(a, b, op) {
            let result;
            switch(op) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/': 
                    if (b === 0) return 'Error';
                    result = a / b; 
                    break;
                case '%': result = a % b; break;
                default: result = b;
            }
            // Round to avoid floating point issues
            if (typeof result === 'number' && !Number.isInteger(result)) {
                result = parseFloat(result.toPrecision(12));
            }
            return result;
        }

        function getOpSymbol(op) {
            switch(op) {
                case '+': return '+';
                case '-': return '−';
                case '*': return '×';
                case '/': return '÷';
                case '%': return '%';
                default: return op;
            }
        }

        // ----- Evaluate -----
        function evaluate() {
            if (!operator) {
                // Just show current value
                expression = displayValue + ' =';
                updateDisplay();
                return;
            }

            const current = parseFloat(displayValue);
            const result = calculate(firstOperand, current, operator);
            
            if (result === 'Error') {
                displayValue = 'Error';
                expression = '';
                operator = null;
                firstOperand = null;
                waitingForSecond = false;
                justEvaluated = true;
                updateDisplay();
                return;
            }

            expression = displayValue + ' =';
            displayValue = String(result);
            firstOperand = result;
            operator = null;
            waitingForSecond = false;
            justEvaluated = true;

            // Glow animation
            resultEl.classList.remove('result-glow');
            void resultEl.offsetWidth;
            resultEl.classList.add('result-glow');

            updateDisplay();
        }

        // ----- Clear -----
        function clearAll() {
            displayValue = '0';
            expression = '';
            firstOperand = null;
            operator = null;
            waitingForSecond = false;
            justEvaluated = false;
            updateDisplay();
        }

        // ----- Delete (backspace) -----
        function deleteLast() {
            if (justEvaluated) {
                clearAll();
                return;
            }
            if (displayValue.length > 1) {
                displayValue = displayValue.slice(0, -1);
            } else {
                displayValue = '0';
            }
            updateDisplay();
        }

        // ----- Handle Button Click -----
        function handleClick(e) {
            const btn = e.currentTarget;
            const action = btn.dataset.action;
            const value = btn.dataset.value;

            // Pop animation
            btn.classList.remove('btn-pop');
            void btn.offsetWidth;
            btn.classList.add('btn-pop');

            switch(action) {
                case 'number':
                    inputNumber(value);
                    break;
                case 'operator':
                    inputOperator(value);
                    return; // already updated
                case 'equals':
                    evaluate();
                    return;
                case 'clear':
                    clearAll();
                    return;
                case 'delete':
                    deleteLast();
                    return;
                default:
                    return;
            }

            updateDisplay();
        }

        // ----- Keyboard Support -----
        function handleKeyboard(e) {
            const key = e.key;
            
            if (key >= '0' && key <= '9') {
                e.preventDefault();
                inputNumber(key);
                updateDisplay();
                return;
            }

            switch(key) {
                case '.':
                    e.preventDefault();
                    inputNumber('.');
                    updateDisplay();
                    break;
                case '+':
                case '-':
                case '*':
                case '/':
                    e.preventDefault();
                    inputOperator(key);
                    break;
                case '%':
                    e.preventDefault();
                    inputOperator('%');
                    break;
                case 'Enter':
                case '=':
                    e.preventDefault();
                    evaluate();
                    break;
                case 'Backspace':
                    e.preventDefault();
                    deleteLast();
                    break;
                case 'Escape':
                case 'c':
                case 'C':
                    e.preventDefault();
                    clearAll();
                    break;
            }
        }

        // ----- Init -----
        function init() {
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', handleClick);
                btn.addEventListener('touchstart', function(e) {
                    // Prevent double-tap zoom on mobile
                    e.preventDefault();
                }, { passive: true });
            });

            document.addEventListener('keydown', handleKeyboard);

            // Prevent context menu on long press
            document.addEventListener('contextmenu', (e) => e.preventDefault());

            updateDisplay();
        }

        init();
    })();
</script>
</body>
</html>
