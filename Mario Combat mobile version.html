 <meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎮 Super Mario - Mobile Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
        }
        .game-wrapper {
            background: linear-gradient(145deg, #1a2a6c, #b21f1f, #fdbb2d);
            padding: 12px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 215, 0, 0.5);
            max-width: 500px;
            width: 100%;
            margin: 10px;
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 15px;
            background: #87CEEB;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.3);
            border: 2px solid #f1c40f;
            cursor: pointer;
            width: 100%;
            height: auto;
            touch-action: none;
        }
        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #ffd700;
            flex-wrap: wrap;
            gap: 5px;
        }
        .info div {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        #status {
            color: #2ecc71;
            font-size: 14px;
            text-shadow: 0 0 15px #2ecc71;
            transition: all 0.3s;
        }
        .score-value {
            color: #f1c40f;
            font-size: 14px;
            min-width: 20px;
            display: inline-block;
        }

        /* ===== کنترل‌های لمسی ===== */
        .touch-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 10px;
            gap: 10px;
            touch-action: none;
        }
        .touch-controls .left {
            display: flex;
            gap: 8px;
        }
        .touch-controls .right {
            display: flex;
            gap: 8px;
        }
        .touch-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.6);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 255, 255, 0.1);
            transition: 0.1s;
            touch-action: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-btn:active,
        .touch-btn.active {
            transform: scale(0.88);
            background: rgba(255, 215, 0, 0.25);
            border-color: #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .touch-btn.jump-btn {
            width: 80px;
            height: 80px;
            font-size: 32px;
            background: rgba(231, 76, 60, 0.3);
            border-color: #e74c3c;
        }
        .touch-btn.jump-btn:active,
        .touch-btn.jump-btn.active {
            background: rgba(231, 76, 60, 0.5);
            border-color: #ff6b6b;
            box-shadow: 0 0 40px rgba(231, 76, 60, 0.4);
        }
        .touch-btn.dash-btn {
            width: 50px;
            height: 50px;
            font-size: 18px;
            background: rgba(52, 152, 219, 0.3);
            border-color: #3498db;
        }
        .touch-btn.dash-btn:active,
        .touch-btn.dash-btn.active {
            background: rgba(52, 152, 219, 0.5);
            border-color: #5dade2;
        }

        @media (max-width: 500px) {
            .touch-btn {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .touch-btn.jump-btn {
                width: 65px;
                height: 65px;
                font-size: 26px;
            }
            .touch-btn.dash-btn {
                width: 42px;
                height: 42px;
                font-size: 14px;
            }
            .info {
                font-size: 10px;
                padding: 6px 10px;
            }
            #status {
                font-size: 11px;
            }
            .score-value {
                font-size: 12px;
            }
        }
        @media (max-width: 400px) {
            .touch-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
            }
            .touch-btn.jump-btn {
                width: 55px;
                height: 55px;
                font-size: 22px;
            }
            .touch-btn.dash-btn {
                width: 36px;
                height: 36px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="500" height="400"></canvas>
        <div class="info">
            <div>⭐ <span class="score-value" id="scoreDisplay">0</span></div>
            <div>🏃 <span class="score-value" id="distanceDisplay">0</span>m</div>
            <div>👾 <span class="score-value" id="enemyCount">0</span></div>
            <div id="status">▶ Playing</div>
        </div>

        <div class="touch-controls">
            <div class="left">
                <button class="touch-btn" id="btnLeft">◀</button>
                <button class="touch-btn" id="btnRight">▶</button>
            </div>
            <div class="right">
                <button class="touch-btn dash-btn" id="btnDash">⚡</button>
                <button class="touch-btn jump-btn" id="btnJump">▲</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreSpan = document.getElementById('scoreDisplay');
        const distanceSpan = document.getElementById('distanceDisplay');
        const enemyCountSpan = document.getElementById('enemyCount');
        const statusDiv = document.getElementById('status');

        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        const btnDash = document.getElementById('btnDash');

        // ======== تنظیمات ========
        const GRAVITY = 0.5;
        const JUMP_FORCE = -11.5;
        const MOVE_SPEED = 4.5;
        const WORLD_WIDTH = 12000;
        const WIN_DISTANCE = 10000;
        const MAX_PARTICLES = 150;

        // ======== متغیرها ========
        let cameraX = 0;
        let distance = 0;
        let score = 0;
        let gameOver = false;
        let win = false;
        let frameCount = 0;
        let screenShake = 0;
        let particles = [];
        let fireworkParticles = [];
        let celebrationTimer = 0;
        let comboCount = 0;
        let endScreenTimer = 0;
        let showEndScreen = false;

        const touch = { left: false, right: false, jump: false, dash: false };

        const mario = {
            x: 120,
            y: 280,
            w: 30,
            h: 38,
            vy: 0,
            onGround: false,
            facing: 1,
            frame: 0,
            animTimer: 0,
            invincible: 0,
            dashCooldown: 0
        };

        let coins = [];
        let enemies = [];
        let platforms = [];
        let movingPlatforms = [];
        let powerups = [];
        let starField = [];

        for (let i = 0; i < 50; i++) {
            starField.push({
                x: Math.random() * WORLD_WIDTH,
                y: Math.random() * 250,
                size: Math.random() * 2 + 1,
                twinkle: Math.random() * Math.PI * 2
            });
        }

        function rectCollide(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x &&
                a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function updateUI() {
            scoreSpan.textContent = score;
            distanceSpan.textContent = Math.floor(distance);
            enemyCountSpan.textContent = enemies.filter(e => e.alive).length;
        }

        function spawnParticles(x, y, color, count = 12, speed = 5) {
            const actualCount = Math.min(count, 20);
            for (let i = 0; i < actualCount && particles.length < MAX_PARTICLES; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = Math.random() * speed + 1;
                particles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd - 2,
                    life: 1,
                    decay: 0.01 + Math.random() * 0.02,
                    size: 2 + Math.random() * 5,
                    color,
                    gravity: 0.05
                });
            }
        }

        function spawnFirework(x, y) {
            const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF85A2', '#A8E6CF', '#FF9A76', '#FFD93D'];
            for (let i = 0; i < 20 && fireworkParticles.length < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                fireworkParticles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    life: 1,
                    decay: 0.008 + Math.random() * 0.015,
                    size: 3 + Math.random() * 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    gravity: 0.04
                });
            }
        }

        function buildLevel() {
            platforms = [];
            coins = [];
            enemies = [];
            particles = [];
            powerups = [];
            movingPlatforms = [];
            fireworkParticles = [];
            distance = 0;
            score = 0;
            gameOver = false;
            win = false;
            showEndScreen = false;
            endScreenTimer = 0;
            cameraX = 0;
            frameCount = 0;
            comboCount = 0;
            celebrationTimer = 0;
            mario.x = 120;
            mario.y = 280;
            mario.vy = 0;
            mario.onGround = false;
            mario.invincible = 0;
            statusDiv.textContent = '▶ Playing';
            statusDiv.style.color = '#2ecc71';

            platforms.push({ x: 0, y: 350, w: 600, h: 50 });

            const platData = [
                { x: 680, y: 310, w: 100, h: 16 },
                { x: 830, y: 250, w: 100, h: 16 },
                { x: 980, y: 350, w: 350, h: 50 },
                { x: 1380, y: 300, w: 90, h: 16 },
                { x: 1520, y: 240, w: 90, h: 16 },
                { x: 1660, y: 300, w: 90, h: 16 },
                { x: 1800, y: 350, w: 320, h: 50 },
                { x: 2180, y: 270, w: 120, h: 16 },
                { x: 2360, y: 210, w: 120, h: 16 },
                { x: 2540, y: 270, w: 120, h: 16 },
                { x: 2720, y: 350, w: 280, h: 50 },
                { x: 3060, y: 300, w: 100, h: 16 },
                { x: 3220, y: 240, w: 100, h: 16 },
                { x: 3380, y: 300, w: 100, h: 16 },
                { x: 3540, y: 350, w: 400, h: 50 },
                { x: 4000, y: 280, w: 110, h: 16 },
                { x: 4160, y: 220, w: 110, h: 16 },
                { x: 4320, y: 280, w: 110, h: 16 },
                { x: 4480, y: 350, w: 320, h: 50 },
                { x: 4860, y: 310, w: 100, h: 16 },
                { x: 5020, y: 250, w: 100, h: 16 },
                { x: 5180, y: 350, w: 350, h: 50 },
                { x: 5600, y: 300, w: 100, h: 16 },
                { x: 5760, y: 240, w: 100, h: 16 },
                { x: 5920, y: 300, w: 100, h: 16 },
                { x: 6080, y: 350, w: 320, h: 50 },
                { x: 6500, y: 340, w: 1600, h: 60 },
                { x: 8200, y: 310, w: 1400, h: 90 },
            ];
            for (let p of platData) platforms.push(p);

            movingPlatforms.push({ x: 1250, y: 250, w: 100, h: 16, startX: 1200, endX: 1360, speed: 1.2, dir: 1 });
            movingPlatforms.push({ x: 3800, y: 260, w: 100, h: 16, startX: 3750, endX: 3920, speed: 1.4, dir: 1 });
            movingPlatforms.push({ x: 5400, y: 260, w: 100, h: 16, startX: 5350, endX: 5520, speed: 1.3, dir: 1 });

            const coinPos = [
                [700, 280],
                [740, 280],
                [850, 220],
                [890, 220],
                [1050, 320],
                [1090, 320],
                [1130, 320],
                [1400, 270],
                [1440, 270],
                [1540, 210],
                [1580, 210],
                [1680, 270],
                [1720, 270],
                [1860, 320],
                [1900, 320],
                [1940, 320],
                [2200, 240],
                [2260, 240],
                [2380, 180],
                [2440, 180],
                [2560, 240],
                [2620, 240],
                [2770, 320],
                [2810, 320],
                [2850, 320],
                [3080, 270],
                [3130, 270],
                [3240, 210],
                [3290, 210],
                [3400, 270],
                [3450, 270],
                [3600, 320],
                [3640, 320],
                [3680, 320],
                [4020, 250],
                [4070, 250],
                [4180, 190],
                [4230, 190],
                [4340, 250],
                [4390, 250],
                [4530, 320],
                [4570, 320],
                [4610, 320],
                [4880, 280],
                [4930, 280],
                [5040, 220],
                [5090, 220],
                [5220, 320],
                [5260, 320],
                [5300, 320],
                [5620, 270],
                [5670, 270],
                [5780, 210],
                [5830, 210],
                [5940, 270],
                [5990, 270],
                [6130, 320],
                [6170, 320],
                [6210, 320],
                [6600, 310],
                [6700, 310],
                [6800, 310],
                [6900, 310],
                [7000, 310],
                [7100, 310],
                [7200, 310],
                [7300, 310],
                [7400, 310],
                [8300, 280],
                [8400, 280],
                [8500, 280],
                [8600, 280],
                [8700, 280],
                [8800, 280],
                [8900, 280],
            ];
            for (let p of coinPos) {
                coins.push({ x: p[0], y: p[1], w: 16, h: 16, collected: false, glow: Math.random() * Math.PI * 2,
                    bob: Math.random() * Math.PI * 2 });
            }

            const enemyData = [
                { x: 450, y: 320, vx: -1.5 },
                { x: 1050, y: 320, vx: -1.8 },
                { x: 1420, y: 270, vx: -1.3 },
                { x: 1880, y: 320, vx: -1.9 },
                { x: 2240, y: 240, vx: -1.5 },
                { x: 2800, y: 320, vx: -2.0 },
                { x: 3120, y: 270, vx: -1.4 },
                { x: 3620, y: 320, vx: -1.8 },
                { x: 4060, y: 250, vx: -1.6 },
                { x: 4560, y: 320, vx: -1.9 },
                { x: 4980, y: 280, vx: -1.3 },
                { x: 5660, y: 270, vx: -1.5 },
                { x: 6160, y: 320, vx: -1.7 },
                { x: 6700, y: 310, vx: -1.4 },
            ];
            for (let e of enemyData) {
                enemies.push({ x: e.x, y: e.y - 34, w: 28, h: 34, vx: e.vx, alive: true, phase: Math.random() * Math.PI *
                        2 });
            }

            powerups.push({ x: 2200, y: 220, w: 24, h: 24, type: 'star', collected: false, glow: 0 });
            powerups.push({ x: 4000, y: 230, w: 24, h: 24, type: 'mushroom', collected: false, glow: 0 });
            powerups.push({ x: 5600, y: 230, w: 24, h: 24, type: 'star', collected: false, glow: 0 });

            updateUI();
        }

        function update() {
            if (gameOver || win) {
                if (win) {
                    celebrationTimer++;
                    if (celebrationTimer % 20 === 0 && celebrationTimer < 600) {
                        spawnFirework(
                            Math.random() * canvas.width + cameraX,
                            Math.random() * 200 + 40
                        );
                    }
                    if (celebrationTimer > 600 && !showEndScreen) {
                        showEndScreen = true;
                        endScreenTimer = 0;
                    }
                    if (showEndScreen) {
                        endScreenTimer++;
                    }
                }
                updateParticles();
                return;
            }

            frameCount++;

            let moveX = 0;
            if (touch.left) { moveX = -MOVE_SPEED;
                mario.facing = -1; }
            if (touch.right) { moveX = MOVE_SPEED;
                mario.facing = 1; }

            if (touch.dash && mario.dashCooldown <= 0 && mario.onGround) {
                moveX *= 2.5;
                mario.dashCooldown = 25;
                spawnParticles(mario.x + mario.w / 2, mario.y + mario.h, '#87CEEB', 8);
            }
            if (mario.dashCooldown > 0) mario.dashCooldown--;

            mario.x += moveX;

            if (moveX !== 0 && mario.onGround) {
                mario.animTimer++;
                if (mario.animTimer % 5 === 0) mario.frame = (mario.frame + 1) % 4;
            } else if (mario.onGround) {
                mario.frame = 0;
            }

            if (touch.jump && mario.onGround) {
                mario.vy = JUMP_FORCE;
                mario.onGround = false;
                spawnParticles(mario.x + mario.w / 2, mario.y + mario.h, '#87CEEB', 6);
            }
            if (touch.jump && mario.vy < -2) {
                mario.vy -= 0.12;
            }

            mario.vy += GRAVITY;
            mario.y += mario.vy;

            mario.onGround = false;
            const allPlatforms = [...platforms, ...movingPlatforms];
            for (let p of allPlatforms) {
                if (rectCollide(mario, p)) {
                    if (mario.vy >= 0 && mario.y + mario.h - mario.vy <= p.y + 8) {
                        mario.y = p.y - mario.h;
                        mario.vy = 0;
                        mario.onGround = true;
                    } else if (mario.vy < 0 && mario.y <= p.y + p.h) {
                        mario.y = p.y + p.h;
                        mario.vy = 0;
                    }
                }
            }

            if (mario.x < 0) mario.x = 0;
            if (mario.x + mario.w > WORLD_WIDTH) mario.x = WORLD_WIDTH - mario.w;

            if (mario.x > distance) {
                distance = mario.x;
                if (Math.floor(distance) % 100 === 0 && distance > 0) {
                    score += 5;
                    spawnParticles(mario.x, mario.y - 20, '#f1c40f', 6);
                    updateUI();
                }
            }

            if (mario.y > canvas.height + 80) {
                gameOver = true;
                statusDiv.textContent = '💀 You fell!';
                statusDiv.style.color = '#e74c3c';
                return;
            }

            for (let c of coins) {
                if (!c.collected && rectCollide(mario, c)) {
                    c.collected = true;
                    score += 15;
                    comboCount++;
                    if (comboCount % 5 === 0) {
                        score += 20;
                        spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#FFD700', 15);
                    }
                    spawnParticles(c.x + c.w / 2, c.y + c.h / 2, '#FFD700', 8);
                    updateUI();
                }
            }

            for (let p of powerups) {
                if (!p.collected && rectCollide(mario, p)) {
                    p.collected = true;
                    if (p.type === 'star') {
                        score += 50;
                        mario.invincible = 200;
                        spawnParticles(mario.x + mario.w / 2, mario.y + mario.h / 2, '#FFD700', 25);
                        statusDiv.textContent = '⭐ Invincible!';
                        statusDiv.style.color = '#ffd700';
                        setTimeout(() => {
                            if (!gameOver && !win) {
                                statusDiv.textContent = '▶ Playing';
                                statusDiv.style.color = '#2ecc71';
                            }
                        }, 1800);
                    } else if (p.type === 'mushroom') {
                        score += 30;
                        mario.w = 36;
                        mario.h = 46;
                        mario.y -= 8;
                        spawnParticles(mario.x + mario.w / 2, mario.y + mario.h / 2, '#e74c3c', 15);
                        setTimeout(() => { mario.w = 30;
                            mario.h = 38; }, 6000);
                    }
                    updateUI();
                }
            }

            for (let mp of movingPlatforms) {
                mp.x += mp.speed * mp.dir;
                if (mp.x >= mp.endX || mp.x <= mp.startX) mp.dir *= -1;
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                e.x += e.vx;
                e.phase += 0.05;

                for (let p of allPlatforms) {
                    if (rectCollide(e, p)) {
                        if (e.vx < 0) e.x = p.x + p.w;
                        else e.x = p.x - e.w;
                        e.vx *= -1;
                        break;
                    }
                }

                if (e.x < -200 || e.x > WORLD_WIDTH + 200) {
                    e.alive = false;
                    updateUI();
                    continue;
                }

                if (e.alive && rectCollide(mario, e)) {
                    if (mario.invincible > 0) {
                        e.alive = false;
                        score += 20;
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#ff6b6b', 12);
                        updateUI();
                        continue;
                    }
                    if (mario.vy > 0 && mario.y + mario.h - mario.vy <= e.y + 10) {
                        e.alive = false;
                        mario.vy = -9;
                        score += 30;
                        comboCount += 2;
                        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, '#e74c3c', 15);
                        screenShake = 6;
                        updateUI();
                    } else if (mario.invincible === 0) {
                        gameOver = true;
                        statusDiv.textContent = '💀 Hit by enemy!';
                        statusDiv.style.color = '#e74c3c';
                        return;
                    }
                }
            }

            enemies = enemies.filter(e => e.alive);
            updateUI();

            if (mario.invincible > 0) mario.invincible--;

            if (distance >= WIN_DISTANCE) {
                win = true;
                celebrationTimer = 0;
                statusDiv.textContent = '🏆 Champion! 🌟';
                statusDiv.style.color = '#f1c40f';
                for (let i = 0; i < 8; i++) {
                    setTimeout(() => {
                        spawnFirework(
                            mario.x + (Math.random() - 0.5) * 250,
                            Math.random() * 200 + 40
                        );
                    }, i * 120);
                }
            }

            updateParticles();

            let targetCam = mario.x - canvas.width * 0.4;
            cameraX += (targetCam - cameraX) * 0.08;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - canvas.width));

            if (screenShake > 0) screenShake *= 0.9;
            if (screenShake < 0.1) screenShake = 0;
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0.05;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = fireworkParticles.length - 1; i >= 0; i--) {
                let p = fireworkParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity || 0.05;
                p.vx *= 0.99;
                p.vy *= 0.99;
                p.life -= p.decay;
                if (p.life <= 0) fireworkParticles.splice(i, 1);
            }
        }

        function draw() {
            ctx.save();

            if (screenShake > 0.5) {
                ctx.translate(
                    (Math.random() - 0.5) * screenShake,
                    (Math.random() - 0.5) * screenShake
                );
            }

            const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
            sky.addColorStop(0, '#0c1445');
            sky.addColorStop(0.4, '#1a3a7a');
            sky.addColorStop(0.7, '#4a8bc2');
            sky.addColorStop(1, '#87CEEB');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let s of starField) {
                const sx = s.x - cameraX * 0.1;
                if (sx > -10 && sx < canvas.width + 10) {
                    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(s.twinkle + frameCount * 0.02);
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(sx, s.y, s.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            const clouds = [
                [120, 50, 60],
                [400, 35, 80],
                [800, 65, 55],
                [1500, 40, 70],
                [2300, 55, 60],
                [3500, 40, 75],
                [4800, 60, 55],
                [6200, 45, 70],
                [7800, 55, 65]
            ];
            for (let c of clouds) {
                const cx = c[0] - cameraX * 0.15;
                if (cx > -80 && cx < canvas.width + 80) {
                    ctx.beginPath();
                    ctx.arc(cx, c[1], c[2] * 0.5, 0, Math.PI * 2);
                    ctx.arc(cx + c[2] * 0.4, c[1] - c[2] * 0.25, c[2] * 0.4, 0, Math.PI * 2);
                    ctx.arc(cx + c[2] * 0.7, c[1], c[2] * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            ctx.save();
            ctx.translate(-cameraX, 0);

            for (let p of platforms) {
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 3;
                const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
                if (p.y < 280) {
                    grad.addColorStop(0, '#6a9fb5');
                    grad.addColorStop(1, '#2a5a7a');
                } else if (p.y > 330) {
                    grad.addColorStop(0, '#8B6B4D');
                    grad.addColorStop(1, '#6B4F3A');
                } else {
                    grad.addColorStop(0, '#7a9a5a');
                    grad.addColorStop(1, '#3a6a2a');
                }
                ctx.fillStyle = grad;
                ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.shadowBlur = 0;
            }

            for (let mp of movingPlatforms) {
                ctx.shadowColor = 'rgba(0,0,0,0.25)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 3;
                ctx.fillStyle = '#4a8a9a';
                ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(mp.dir > 0 ? '→' : '←', mp.x + mp.w / 2, mp.y + 13);
            }

            for (let c of coins) {
                if (c.collected) continue;
                c.glow += 0.05;
                c.bob += 0.03;
                const bobY = Math.sin(c.bob) * 2;
                const glowSize = 12 + 4 * Math.sin(c.glow);

                const grd = ctx.createRadialGradient(
                    c.x + c.w / 2, c.y + c.h / 2 + bobY, 2,
                    c.x + c.w / 2, c.y + c.h / 2 + bobY, glowSize
                );
                grd.addColorStop(0, 'rgba(255,215,0,0.4)');
                grd.addColorStop(1, 'rgba(255,215,0,0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(c.x + c.w / 2, c.y + c.h / 2 + bobY, glowSize, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = '#FFD700';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(c.x + c.w / 2, c.y + c.h / 2 + bobY, c.w / 2, 0, Math.PI * 2);
                ctx.fillStyle = '#FFD700';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#B8860B';
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', c.x + c.w / 2, c.y + c.h / 2 + bobY + 1);
            }

            for (let p of powerups) {
                if (p.collected) continue;
                p.glow += 0.05;
                const bobY = Math.sin(p.glow * 1.5) * 2;
                ctx.shadowColor = p.type === 'star' ? '#FFD700' : '#e74c3c';
                ctx.shadowBlur = 20;
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.type === 'star' ? '⭐' : '🍄', p.x + p.w / 2, p.y + p.h / 2 + bobY);
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;

                const grad = ctx.createRadialGradient(
                    e.x + 6, e.y + 6, 4,
                    e.x + e.w / 2, e.y + e.h / 2, e.w
                );
                grad.addColorStop(0, '#ff6b6b');
                grad.addColorStop(1, '#a02020');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.ellipse(e.x + e.w / 2, e.y + e.h / 2, e.w / 2, e.h / 2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.ellipse(e.x + 8, e.y + 12, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(e.x + e.w - 8, e.y + 12, 6, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#1a1a2e';
                const lookX = e.vx < 0 ? 2 : -2;
                ctx.beginPath();
                ctx.arc(e.x + 8 + lookX, e.y + 14, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(e.x + e.w - 8 + lookX, e.y + 14, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 4;
                ctx.fillStyle = '#c0392b';
                ctx.beginPath();
                ctx.ellipse(e.x + e.w / 2, e.y + 5, e.w / 2 + 2, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#2d3436';
                const legOffset = Math.sin(e.phase * 2) * 2;
                ctx.fillRect(e.x + 3, e.y + e.h - 4 + legOffset, 7, 4);
                ctx.fillRect(e.x + e.w - 10, e.y + e.h - 4 - legOffset, 7, 4);
                ctx.shadowBlur = 0;
            }

            if (mario.invincible > 0 && Math.floor(frameCount / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            drawMario();
            ctx.globalAlpha = 1;

            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            for (let p of fireworkParticles) {
                ctx.globalAlpha = p.life;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 15;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.restore();

            if (!win && !gameOver) {
                const finishX = WIN_DISTANCE - cameraX;
                if (finishX > 0 && finishX < canvas.width) {
                    ctx.save();
                    ctx.fillStyle = 'rgba(255,215,0,0.08)';
                    ctx.fillRect(finishX - 2, 0, 4, canvas.height);
                    ctx.fillStyle = 'rgba(255,215,0,0.4)';
                    ctx.font = 'bold 16px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('🏁', finishX, 12);
                    ctx.restore();
                }
            }

            if (gameOver) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.fillRect(canvas.width / 2 - 140, 120, 280, 80);
                ctx.fillStyle = '#ff4444';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 20;
                ctx.fillText('💀 GAME OVER', canvas.width / 2, 148);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('Tap to restart', canvas.width / 2, 188);
                ctx.restore();
            } else if (win && showEndScreen) {
                // ======== صفحه پایان ========
                ctx.save();

                // پس‌زمینه تیره
                const grad = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 10,
                    canvas.width / 2, canvas.height / 2, 300
                );
                grad.addColorStop(0, 'rgba(255,215,0,0.15)');
                grad.addColorStop(0.5, 'rgba(255,215,0,0.05)');
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // باکس اصلی
                const boxY = 70;
                ctx.fillStyle = 'rgba(0,0,0,0.85)';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.beginPath();
                ctx.roundRect(canvas.width / 2 - 200, boxY, 400, 210, 20);
                ctx.fill();
                ctx.shadowBlur = 0;

                // عنوان
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 30;
                ctx.fillText('🏆 You Win!', canvas.width / 2, boxY + 55);
                ctx.shadowBlur = 0;

                // آمار
                ctx.fillStyle = '#fff';
                ctx.font = '22px Arial';
                ctx.fillText(`⭐ Score: ${score}`, canvas.width / 2, boxY + 110);

                ctx.fillStyle = '#4ECDC4';
                ctx.font = '20px Arial';
                ctx.fillText(`🏃 Distance: ${Math.floor(distance)}m`, canvas.width / 2, boxY + 150);

                ctx.fillStyle = '#FFE66D';
                ctx.font = '18px Arial';
                ctx.fillText(`👾 Enemies Defeated: ${enemies.filter(e => !e.alive).length}`, canvas.width / 2, boxY + 190);

                // دکمه ریستارت
                const btnX = canvas.width / 2 - 60;
                const btnY2 = boxY + 225;
                ctx.fillStyle = 'rgba(255,215,0,0.2)';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.roundRect(btnX, btnY2, 120, 40, 20);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(btnX, btnY2, 120, 40, 20);
                ctx.stroke();
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 18px Arial';
                ctx.fillText('🔄 Play Again', canvas.width / 2, btnY2 + 20);

                // هشدار برای کلیک
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = '14px Arial';
                ctx.fillText('Tap anywhere to restart', canvas.width / 2, btnY2 + 70);

                ctx.restore();
            } else if (win && !showEndScreen) {
                // انیمیشن جشن قبل از صفحه پایان
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.fillText('🎉 Congratulations! 🎉', canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '18px Arial';
                ctx.fillText('Loading results...', canvas.width / 2, canvas.height / 2 + 50);
                ctx.restore();
            }

            ctx.restore();
        }

        // ======== رسم ماریو ========
        function drawMario() {
            const mx = mario.x,
                my = mario.y;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 15;

            ctx.fillStyle = '#e53e3e';
            ctx.beginPath();
            ctx.ellipse(mx + 15, my + 5, 15, 9, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(mx + 3, my + 8, 24, 3);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#FDBF8A';
            ctx.fillRect(mx + 3, my + 10, 24, 13);

            ctx.fillStyle = 'white';
            ctx.shadowBlur = 3;
            ctx.beginPath();
            ctx.ellipse(mx + (mario.facing === 1 ? 18 : 8), my + 13, 5, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(mx + (mario.facing === 1 ? 10 : 18), my + 13, 5, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1a1a2e';
            ctx.shadowBlur = 0;
            const eyeOff = mario.facing === 1 ? 3 : -3;
            ctx.beginPath();
            ctx.arc(mx + (mario.facing === 1 ? 18 : 8) + eyeOff, my + 15, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(mx + (mario.facing === 1 ? 10 : 18) + eyeOff, my + 15, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#5D3A1A';
            ctx.fillRect(mx + 4, my + 18, 22, 2);
            ctx.fillRect(mx + 3, my + 20, 24, 2);

            ctx.shadowBlur = 10;
            ctx.fillStyle = '#e53e3e';
            ctx.fillRect(mx + 3, my + 23, 24, 8);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#f1c40f';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.arc(mx + 15, my + 28, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 6;
            ctx.fillStyle = '#2d6cb0';
            ctx.fillRect(mx + 2, my + 31, 26, 4);

            ctx.shadowBlur = 4;
            ctx.fillStyle = '#5D3A1A';
            if (mario.onGround && (touch.left || touch.right)) {
                const step = Math.sin(frameCount * 0.2) * 2.5;
                ctx.fillRect(mx + 2, my + 35, 9, 6 + step);
                ctx.fillRect(mx + 19, my + 35, 9, 6 - step);
            } else if (!mario.onGround) {
                ctx.fillRect(mx + 2, my + 35, 9, 5);
                ctx.fillRect(mx + 19, my + 35, 9, 5);
            } else {
                ctx.fillRect(mx + 2, my + 35, 9, 6);
                ctx.fillRect(mx + 19, my + 35, 9, 6);
            }

            if (mario.invincible > 0) {
                ctx.shadowBlur = 30;
                ctx.shadowColor = '#ffd700';
                ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mx + 15, my + 20, 22, 0, Math.PI * 2);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        // ======== polyfill roundRect ========
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ======== کنترل‌های لمسی ========
        btnLeft.addEventListener('touchstart', (e) => { e.preventDefault();
            touch.left = true;
            btnLeft.classList.add('active'); });
        btnLeft.addEventListener('touchend', (e) => { e.preventDefault();
            touch.left = false;
            btnLeft.classList.remove('active'); });
        btnLeft.addEventListener('touchcancel', (e) => { touch.left = false;
            btnLeft.classList.remove('active'); });

        btnRight.addEventListener('touchstart', (e) => { e.preventDefault();
            touch.right = true;
            btnRight.classList.add('active'); });
        btnRight.addEventListener('touchend', (e) => { e.preventDefault();
            touch.right = false;
            btnRight.classList.remove('active'); });
        btnRight.addEventListener('touchcancel', (e) => { touch.right = false;
            btnRight.classList.remove('active'); });

        btnJump.addEventListener('touchstart', (e) => { e.preventDefault();
            touch.jump = true;
            btnJump.classList.add('active'); });
        btnJump.addEventListener('touchend', (e) => { e.preventDefault();
            touch.jump = false;
            btnJump.classList.remove('active'); });
        btnJump.addEventListener('touchcancel', (e) => { touch.jump = false;
            btnJump.classList.remove('active'); });

        btnDash.addEventListener('touchstart', (e) => { e.preventDefault();
            touch.dash = true;
            btnDash.classList.add('active'); });
        btnDash.addEventListener('touchend', (e) => { e.preventDefault();
            touch.dash = false;
            btnDash.classList.remove('active'); });
        btnDash.addEventListener('touchcancel', (e) => { touch.dash = false;
            btnDash.classList.remove('active'); });

        canvas.addEventListener('click', () => {
            if (gameOver || win) {
                buildLevel();
                fireworkParticles = [];
                particles = [];
            }
        });

        canvas.addEventListener('touchstart', (e) => {
            if (gameOver || win) {
                buildLevel();
                fireworkParticles = [];
                particles = [];
            }
        });

        buildLevel();
        gameLoop();

        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
    </script>
</body>
